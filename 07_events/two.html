<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Chai aur code</h1>
    <button id="stop">Stop</button>
</body>
<script>
    // setTimeout(() => {
    //     console.log("Mukul vaid");
    // }, 3000);
    const Mukul = function() {
        console.log("Mukul vaid")
    }
    setTimeout(Mukul,3000);
    
    const changeText = function() {
        document.querySelector('h1').innerHTML = "Best js series"
    }
    const stopme = setTimeout(changeText, 2000);
    document.querySelector('#stop').addEventListener('click', function(){
        clearTimeout(stopme);
        console.log("stopped");
    })
</script>
</html>

<!-- setTimeout => ek fixed time lekr ek bar kam ko karta hai
setinterval => It doing continously work after a fixed interval -->
